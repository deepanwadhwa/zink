name: Run Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_XET: "1"

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the base package and test dependencies
        run: python -m pip install ".[server,test]"
      - name: Run tests without a model
        run: python -m pytest --strict-markers -m "not integration" -q

  integration:
    name: CPU integration (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the CPU backend and test dependencies
        run: python -m pip install ".[cpu,server,test]"
      - name: Configure the model cache
        id: model
        shell: bash
        run: |
          key=$(python scripts/prepare_model.py --cache-key)
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
          printf 'HF_HOME=%s\n' "$RUNNER_TEMP/zink-huggingface" >> "$GITHUB_ENV"
      - name: Cache the pinned model
        id: model-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/zink-huggingface/hub
          key: zink-onnx-${{ runner.os }}-${{ runner.arch }}-${{ steps.model.outputs.key }}
      - name: Download the pinned model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_model.py
      - name: Run integration tests offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest --strict-markers -m integration -q

name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the CPU backend and test dependencies
        run: python -m pip install ".[cpu,server,test]"
      - name: Configure the model cache
        id: model
        shell: bash
        run: |
          key=$(python scripts/prepare_model.py --cache-key)
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
          printf 'HF_HOME=%s\n' "$RUNNER_TEMP/zink-huggingface" >> "$GITHUB_ENV"
      - name: Cache the pinned model
        id: model-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/zink-huggingface/hub
          key: zink-onnx-${{ runner.os }}-${{ runner.arch }}-${{ steps.model.outputs.key }}
      - name: Download the pinned model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/prepare_model.py
      - name: Measure branch coverage with the CPU backend
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          python -m pytest --strict-markers --cov=zink --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Write coverage to the run summary
        run: |
          {
            echo '## Zink branch coverage'
            echo
            echo '```text'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: python-branch-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

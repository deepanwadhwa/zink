name: Build documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install package and documentation tools
        run: python -m pip install . sphinx==8.2.3 sphinx-rtd-theme==3.0.2
      - name: Build documentation with warnings as errors
        run: sphinx-build -b html -W --keep-going docs/source docs/build/html
